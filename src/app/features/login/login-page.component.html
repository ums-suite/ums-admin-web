<form class="login-page" (submit.prevent)="onSubmit()">
  <h1 class="login-page__title">UMS Admin Console</h1>

  <ums-form-field
    #identifierField="umsFormField"
    label="Username or email"
    [required]="true"
    [errors]="errors.identifier ? [errors.identifier] : []"
  >
    <ums-input
      [id]="identifierField.controlId()"
      [ariaDescribedBy]="identifierField.describedBy()"
      [invalid]="identifierField.hasErrors()"
      [required]="true"
      [value]="identifier()"
      (valueChange)="identifier.set($event)"
      autocomplete="username"
    />
  </ums-form-field>

  <ums-form-field
    #passwordField="umsFormField"
    label="Password"
    [required]="true"
    [errors]="errors.password ? [errors.password] : []"
  >
    <ums-input
      type="password"
      [id]="passwordField.controlId()"
      [ariaDescribedBy]="passwordField.describedBy()"
      [invalid]="passwordField.hasErrors()"
      [required]="true"
      [value]="password()"
      (valueChange)="password.set($event)"
      autocomplete="current-password"
    />
  </ums-form-field>

  @if (serverErrorMessage()) {
    <p class="login-page__server-error" role="alert">{{ serverErrorMessage() }}</p>
  }

  <ums-button type="submit" [loading]="submitting()" [disabled]="submitting()" [fullWidth]="true">
    {{ submitting() ? 'Signing in...' : 'Sign in' }}
  </ums-button>
</form>
